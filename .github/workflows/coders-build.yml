name: Coders community build

on:
  push:
    branches: [codex/coders-community]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm install -g pnpm@11.28.2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/coders/check-community.cjs
      - run: pnpm --filter @docmost/editor-ext build && pnpm --filter @docmost/base-formula build
      - run: pnpm --filter server build
      - name: Coders authentication and routing tests
        run: pnpm --filter server test --runInBand --silent integrations/coders common/guards/jwt-auth.guard collaboration/extensions/authentication.extension common/helpers/with-cache
      - run: pnpm --filter client test
      - name: Verify committed frontend matches source
        run: |
          node scripts/coders/build-frontend.cjs
          git diff --exit-code -- coders/public
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish fixed revision
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: coders/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
