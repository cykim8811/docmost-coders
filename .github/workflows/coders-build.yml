name: Coders community build

on:
  push:
    branches: [codex/coders-community]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm install -g pnpm@11.28.2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/coders/check-community.cjs
      - run: pnpm --filter @docmost/editor-ext build && pnpm --filter @docmost/base-formula build
      - run: pnpm --filter server build
      - name: Coders authentication and routing tests
        run: pnpm --filter server test --runInBand --silent integrations/queue/queue-connection integrations/health/redis.health integrations/coders common/guards/jwt-auth.guard collaboration/extensions/authentication.extension common/helpers/with-cache
      - name: Redis compatibility under Core limits
        env:
          CODERS_MODE: "true"
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          docker run -d --name coders-redis-test -p 127.0.0.1:6379:6379 redis:7.4-alpine \
            redis-server --appendonly yes --appendfsync always --save '' \
            --maxmemory 64mb --maxmemory-policy noeviction --maxclients 32 \
            --user default on nopass '~*' '&*' '+@all' '-@admin' '-@dangerous' \
            '+keys' '+info' '+client|setname' '+client|setinfo' '+client|id' '+client|getname' '+client|unblock'
          trap 'docker rm -f coders-redis-test' EXIT
          for attempt in $(seq 1 20); do
            docker exec coders-redis-test redis-cli PING && break
            sleep 1
          done
          node scripts/coders/redis-smoke.cjs
      - run: pnpm --filter client test
      - name: Verify committed frontend matches source
        run: |
          node scripts/coders/build-frontend.cjs
          git diff --exit-code -- coders/public
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish fixed revision
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: coders/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
